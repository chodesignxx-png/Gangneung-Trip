      var sib=rows().filter(function(r){return r!==row}),before=null;
      for(var i=0;i<sib.length;i++){var b=sib[i].getBoundingClientRect();if(y<b.top+b.height/2){before=sib[i];break}}

    function up(){g.removeEventListener('pointermove',move);g.removeEventListener('pointerup',up);g.removeEventListener('pointercancel',up);row.style.transform='';row.classList.remove('dragging');retime()}

  });
}
